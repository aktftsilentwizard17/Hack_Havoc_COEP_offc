<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Cyan-to-Blue Ocean Gradient Container -->
  <rect width="64" height="64" rx="16" fill="url(#oceanGrad)" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Three Stratified Ocean Wave Curves -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#waveGlow)">
    <!-- Top Wave (Surface Layer) -->
    <path d="M 15 22 C 20 17.5, 27 17.5, 32 22 C 37 26.5, 44 26.5, 49 22" />
    <!-- Middle Wave (Thermocline) -->
    <path d="M 15 32 C 20 27.5, 27 27.5, 32 32 C 37 36.5, 44 36.5, 49 32" />
    <!-- Bottom Wave (Abyssal Layer) -->
    <path d="M 15 42 C 20 37.5, 27 37.5, 32 42 C 37 46.5, 44 46.5, 49 42" />
  </g>
</svg>